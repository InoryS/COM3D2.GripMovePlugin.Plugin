[GripMovePlugin]
#---------------------------------------------------
#  Moving controller Move yourself 
#   (in another word, move the whole scence)
#  Activated while holding 'MoveSelfButton'.
#---------------------------------------------------

MoveSelfButton=Trigger
#MoveSelfButton=Grip

## X axis (pitch) rotation and z axis (roll) rotation is locked (disabled) by defaut.
LockRotateXZ=true
#LockRotateXZ=false


#---------------------------------------------------
#  DIRECT mode.
#  Floating GUI screen option
#  Moving floating GUI screen by grabbing it using 'MoveScreenButton'.
#---------------------------------------------------
MoveScreenButton=Grip
#MoveScreenButton=Trigger

## Size of the GUI screen. 
ScreenSize=0.3
#ScreenSize=0.4

## Mouse cursor speed ratio move by Touchpad
MouseCursorSpeed=0.1

## Seconds to activate GUI screen
##  or reset GUI screen position. 
ActivateOrResetSec=1.5

DirectTouchSensorRatio=0.05


#---------------------------------------------------
#  Move to (man's) Head
#  Press "MoveToHeadButton' while holding 'MoveSelfButton'
#---------------------------------------------------
MoveToHeadEnabled=true

MoveToHeadButton=Touchpad
#MoveToHeadModeButton=Grip

HideManHeadWhenJump=true

EyePosDeltaUp=0.1
EyePosDeltaForward=0.05


#---------------------------------------------------
#  Yotogi Command Tool (experimental) - DIRECT + COMMAND mode.
#  This tool is enabled/disabled by Application Menu + 'YotogiToolButton', 
#  when you are in the DIRECT mode.
#  Use Touchpad to select and run Yotogi Skill command.
#---------------------------------------------------
YotogiCommandToolEnabled=true
YotogiCommandToolButton=Grip

## Font size scale of the command list
YotogiCommandToolSize=1.0

## Command List scroll speed ratio
YotogiCommandToolScrollSpeed=1.0

## When true, the command list always looks to HMD position
YotogiCommandToolLookAtCamera=true


#---------------------------------------------------
#  Photo Mode IK Tool (experimental) - DIRECT + IK mode.
#  In the Photo scene, when you are in the DIRECT mode, 
#   this tool can be enabled/disabled by Application Menu + 'IKToolButton', 
#  This tool enables you to twick the pose of your maid, 
#   by grabbing and moving the IK marker with the Grip button.
#  CAUTION: 
#   When this capability enabled, additional data is written to the Photo Save Data.
#   Although the save data can be opend with the vanilla CM3D2, 
#   it is recommended to use separated save data for this IK mode.
#---------------------------------------------------
IKToolEnabled=true
IKToolButton=Grip

## Marker size and default visibility
IKToolMarkerSize=0.03
IKToolShowMarker=true
IKToolMarkerShowAsOverlay=true
IKToolMarkerOverlayAlpha=0.4

IKToolSensorRatio=0.01

IKToolEnableFingerIK=true
IKToolMarkerSizeFinger=0.005

IKToolEnableItemIK=true
IKToolMarkerSizeItemIK=0.01

#---------------------------------------------------
#  Direct Touch Framework (v0.6.0)
#---------------------------------------------------
DirectTouchToolEnabled=true

## touch sphere size of hands (VIVE controller)
DirectTouchToolHandHitRadius=0.03

## position of player's mouth, relative to headset (eye)
DirectTouchToolMouthHitPosY=-0.08
DirectTouchToolMouthHitPosZ=0.02

## touch sphere size of player's mouth
DirectTouchToolMouthHitRadius=0.05


## enable debug loggin for MOD developer
## if enabled, pressing F4 shows hit spheres on Maid.
DirectTouchToolDebug=false


#---------------------------------------------------
#  VIVE Model Replace Tool (v0.6.1)
#  Use "gripmove_model.ini" for detail settings
#---------------------------------------------------
VIVEModelReplaceToolEnabled=true

 