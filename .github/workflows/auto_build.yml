name: Build

on:
  push:
    branches: [ "master","main" ]
  pull_request:
    branches: [ "master","main" ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # COM3D2 (Unity 5.6.4, net35)
      - name: Build COM3D2
        run: |
          dotnet build -c COM3D2-Release

      - name: Publish Artifact
        uses: actions/upload-artifact@v7
        with:
          name: COM3D2.GripMovePlugin.Plugin
          path: |
            /home/runner/work/COM3D2.GripMovePlugin.Plugin/COM3D2.GripMovePlugin.Plugin/COM3D2.GripMovePlugin.Plugin/bin/Release/COM3D2/net35/COM3D2.GripMovePlugin.Plugin.dll

      # COM3D2.5 (Unity 2022 / XR, net48)
      - name: Build COM3D2.5
        run: |
          dotnet build -c COM3D25_UNITY_2022-Release

      - name: Publish Artifact
        uses: actions/upload-artifact@v7
        with:
          name: COM3D25.GripMovePlugin.Plugin
          path: |
            /home/runner/work/COM3D2.GripMovePlugin.Plugin/COM3D2.GripMovePlugin.Plugin/COM3D2.GripMovePlugin.Plugin/bin/Release/COM3D25/net48/COM3D2.GripMovePlugin.Plugin.dll
